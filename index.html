<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Moses Ntembwa Education Services</title>
<style>
:root{--bg:#f4f7fc;--card:#fff;--tx:#0b1b33;--mu:#5b6b85;--pr:#1556c0;--ac:#f5a623;--bd:#dbe3f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1220;--card:#121c30;--tx:#e8eefb;--mu:#9aabc7;--pr:#5b9bff;--bd:#25334f;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--pr);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--pr);z-index:10}
header b{flex:1;font-size:15px}button,.btn{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--pr);color:#fff;text-decoration:none;display:inline-block}
.ic{background:transparent;font-size:22px;padding:2px 8px;color:#fff}.alt{background:transparent;color:var(--pr);border:1px solid var(--pr)}.wa{background:#1fa855}.dg{background:#c0392b}
nav{position:fixed;top:0;left:0;bottom:0;width:270px;max-width:82%;background:var(--card);transform:translateX(-105%);transition:.25s;z-index:20;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 8px 20px;border-right:1px solid var(--bd)}
nav.o{transform:none}nav a{display:block;padding:11px 12px;border-radius:10px;color:var(--tx);text-decoration:none;cursor:pointer}nav a.on{background:var(--pr);color:#fff}
#sh{display:none;position:fixed;inset:0;background:#0007;z-index:15}#sh.o{display:block}
main{max-width:820px;margin:0 auto;padding:14px}h2{margin:.2em 0 .6em}.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:0 0 12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.mu{color:var(--mu);font-size:14px}.tag{background:var(--ac);color:#000;border-radius:20px;padding:2px 10px;font-size:13px;font-weight:600}
input,textarea,select{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:4px 0 10px}
#chat{max-height:50vh;overflow:auto}.m{padding:8px 12px;border-radius:12px;margin:6px 0;max-width:88%}.u{background:var(--pr);color:#fff;margin-left:auto}.b{background:var(--bg);border:1px solid var(--bd)}
.chip{display:inline-block;margin:3px;padding:6px 10px;border:1px solid var(--bd);border-radius:20px;font-size:13px;cursor:pointer}details{margin:6px 0}summary{cursor:pointer;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}.un{border-left:4px solid var(--ac)}
</style></head><body>
<header><button class="ic" onclick="T()" aria-label="Menu">☰</button><b>🎓 Moses Ntembwa Education Services</b><button class="ic" id="bell" onclick="go('Notifications')">🔔</button></header>
<div id="sh" onclick="T()"></div><nav id="nv"></nav><main id="app"></main>
<script>
const WA="260766427244",NAME="Moses Ntembwa";
const S=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},W=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const MENU=[["Dashboard","🏠"],["Notifications","🔔"],["About Us","ℹ️"],["Announcements & News","📢"],["Student Support","🛠️"],["Moses Ntembwa AI","🤖"],["Ten Universities","🏫"],["HELSB","💰"],["Daily Motivation","🌟"],["Terms & Conditions","📜"],["Contact Support","📞"],["Security & Account","🔐"]];
const SV=[["University Application",55,"🎓","Help preparing and submitting your university application.","Certificate/results, NRC or birth certificate, passport photo, email, phone, chosen programs."],["HELSB Application",55,"💰","Guided HELSB loan application.","NRC, admission/acceptance letter, results, guardian details, bank/mobile details."],["HELSB Appeal",35,"⚖️","Help writing and submitting a HELSB appeal.","Application details, reason for appeal, supporting documents."],["ECZ Verification",35,"✅","Assistance with ECZ results verification.","Examination number, year, school, ID."],["ZAQA Verification",35,"📑","Assistance with ZAQA qualification verification.","Certificate copy, institution, year, ID."],["TPIN Certificate Assistance",35,"🧾","Help obtaining a TPIN certificate.","NRC, phone, email, personal details."],["Application Letter / CV Writing",25,"📝","Professional application letter or CV.","Personal details, education, experience, target job or program."],["University Documents & Past Papers",35,"📚","Documents and past papers (price per course).","University, course name and year."]];
const UNI=[["University of Zambia (UNZA)","Lusaka","https://www.unza.zm"],["Copperbelt University (CBU)","Kitwe","https://www.cbu.ac.zm"],["Mulungushi University","Kabwe","https://www.mu.ac.zm"],["Kwame Nkrumah University","Kabwe",""],["Chalimbana University","Chongwe",""],["Mukuba University","Kitwe",""],["Zambia University College of Technology","Ndola",""],["Kapasa Makasa University","Chinsali",""],["Levy Mwanawasa Medical University","Lusaka",""],["Palabana University","Chilanga",""]];
const QA=[["What services do you offer?","We offer University Application (K55), HELSB Application (K55), HELSB Appeal (K35), ECZ Verification (K35), ZAQA Verification (K35), TPIN Assistance (K35), Application Letter/CV (K25) and University Documents & Past Papers (K35 per course)."],["How do I request a service?","Open Student Support, pick a service and tap the WhatsApp button. A prepared message opens in WhatsApp. You can edit it before sending."],["How do I pay?","After you send your request, Moses replies with payment instructions. Processing starts after payment is confirmed. Official fees are separate from the service charge."],["What is HELSB?","HELSB is the Higher Education Loans and Scholarships Board. It manages student loans and scholarships for eligible students in Zambia."],["How do I apply for a HELSB loan?","Check the official HELSB announcement for the open application window, prepare your documents (NRC, admission letter, results, guardian details), then apply on the official portal. Moses can guide you."],["What is a HELSB appeal?","An appeal is a request for review if your application result or award was not what you expected. Prepare your reason and supporting documents."],["What documents does a university application need?","Usually: results/certificate, NRC or birth certificate, passport photo, email and phone. Each university sets its own requirements, so check the official website."],["How does ECZ verification work?","You provide your exam number, year and school so your results can be verified. Moses can guide you through the steps."],["What is ZAQA verification?","ZAQA verifies qualifications. You provide certificate details so they can be confirmed."],["What is a TPIN?","A TPIN is a Taxpayer Identification Number issued by ZRA. Moses can assist with the certificate process."],["Can you write my CV?","Yes. The Application Letter / CV service costs K25. Share your education, experience and target job."],["Do you guarantee admission or a loan?","No. Admission, loans and verification results are decided by the institutions. We only help with the process."],["Are your answers official?","No. This assistant gives automated general guidance. For deadlines and official decisions, always check the official source or ask Moses."],["What are the deadlines?","I do not invent deadlines. Check the Announcements section and official university or HELSB websites."],["How can I contact Moses?","WhatsApp 0766427244. Use Contact Support for a ready-made message."],["Can I get past papers?","Yes: K35 per course. Tell us your university, course and year."]];
const MOT=["Small steps every day lead to big results. Keep going!","Your education is the key that opens many doors.","Believe in yourself. You are capable of more than you know.","Hard work today builds the future you dream of.","Hope is a quiet strength. Keep your faith and keep studying.","Every expert was once a beginner. Start today.","Do not compare your journey with others. Run your own race."];
const TERMS=["Services: We assist with applications, documents and guidance. We do not guarantee admission, loans or verification outcomes.","Charges: Service fees are shown on each service. Official fees (to institutions) are separate and paid by you.","Payment: Work starts after payment is confirmed using the instructions Moses sends you.","Refunds: Where work has not started, refunds may be discussed with Moses. Completed work is not refundable.","Customer duties: Give true, complete information and documents.","Privacy: We collect only what is needed and do not sell your data.","Acceptable use: No abuse, fake accounts, spam or attempts to access restricted areas."];
let U=S("user",null),ann=S("ann",[["New services open","Apply for university and HELSB help through Student Support.","2026-11-20"],["Check official sources","Always confirm intake and HELSB deadlines on official websites.","2026-11-20"]]),nt=S("nt",[]),pend=null,cur="Dashboard";
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function greet(){const h=new Date().getHours();return h<12?"Good morning":h<17?"Good afternoon":"Good evening"}
function T(){$("nv").classList.toggle("o");$("sh").classList.toggle("o")}
function go(n){if(!U)n="Security & Account";cur=n;if(n=="Notifications"){nt.forEach(x=>x.r=1);W("nt",nt)}location.hash=MENU.findIndex(m=>m[0]==n)+1;nav();$("nv").classList.remove("o");$("sh").classList.remove("o");$("app").innerHTML=V[n]();window.scrollTo(0,0);if(V[n].i)V[n].i()}
function nav(){$("nv").innerHTML=`<h3 style="padding:0 12px">${NAME}</h3>`+MENU.map(m=>`<a class="${m[0]==cur?"on":""}" onclick="go('${m[0].replace(/'/g,"\\'")}')">${m[0]}</a>`).join("");document.querySelectorAll('.ic').forEach(b=>b.style.visibility=U?'visible':'hidden');const u=nt.filter(x=>!x.r).length;$("bell").textContent="🔔"+(u?" "+u:"")}
function note(t){nt.unshift({t,d:new Date().toLocaleString(),r:0});W("nt",nt);nav()}
function ph(p){p=p.replace(/[\s\-+]/g,"");if(p.startsWith("260"))p=p.slice(3);if(p.startsWith("0"))p=p.slice(1);return /^[79]\d{8}$/.test(p)?"260"+p:null}
const dayIdx=()=>Math.floor(Date.now()/864e5);
function wa(i){const s=SV[i];const m=`${greet()} ${NAME}, my name is ${U?U.name:"[my name]"}. I would like to request: ${s[0]} (service fee K${s[1]}).\nDetails: \nPlease send me the payment instructions and number, and the requirements. Thank you.`;
$("app").innerHTML=`<div class="card"><h2>${s[2]} ${s[0]}</h2><p>Fee: <b>K${s[1]}</b> (official fees are separate). Edit your message, then send.</p><textarea id="wm" rows="7">${esc(m)}</textarea><button class="wa" onclick="location.href='https://wa.me/${WA}?text='+encodeURIComponent($('wm').value);">Open WhatsApp</button> <button class="alt" onclick="go('Student Support')">Back</button></div>`;if(U)note("Service request prepared: "+s[0])}
const V={
Dashboard(){return `<div class="card"><h2>${greet()}${U?", "+esc(U.name):""} 👋</h2><p class="mu">${U?"Account status: "+U.status+(U.cust?" · Customer":" · Registered user"):"Create an account in Security & Account to get started."}</p></div>
<div class="card un"><b>🌟 Motivation</b><p>${MOT[dayIdx()%MOT.length]}</p></div>
<div class="card"><b>Shortcuts</b><div class="row" style="margin-top:8px">${["Student Support","Ten Universities","HELSB","Moses Ntembwa AI","Announcements & News","Contact Support"].map(n=>`<button class="alt" onclick="go('${n}')">${n}</button>`).join("")}</div></div>
<div class="card"><b>Latest announcement</b><p>${esc(ann[0]?.[0]||"None")}<br><span class="mu">${esc(ann[0]?.[1]||"")}</span></p></div>`},
Notifications(){return `<h2>🔔 Notifications</h2>`+(nt.length?nt.map(x=>`<div class="card"><div>${esc(x.t)}</div><div class="mu">${x.d} · ${x.r?"Read":"Unread"}</div></div>`).join("")+`<button class="alt" onclick="nt=[];W('nt',nt);go('Notifications')">Clear history</button>`:`<div class="card mu">No notifications yet.</div>`)},
"About Us"(){return `<h2>About Us</h2><div class="card"><b>${NAME} Education Services</b><p>We help Zambian students with university applications, HELSB support, verifications and documents, with honest service and clear charges.</p></div><div class="card"><b>Mission</b><p>Make education services simple and affordable for every student.</p><b>Vision</b><p>A Zambia where no student misses an opportunity for lack of guidance.</p><b>Objectives</b><p>Accurate guidance, fast response, transparent fees, respect for privacy.</p><b>Commitment</b><p>We never promise admission or loans. We promise honest, careful help.</p></div>`},
"Announcements & News"(){return `<h2>📢 Announcements & News</h2>`+ann.map(a=>`<div class="card"><b>${esc(a[0])}</b> <span class="tag">${a[2]}</span><p>${esc(a[1])}</p></div>`).join("")},
"Student Support"(){return `<h2>🛠️ Student Support</h2><p class="mu">No guarantee of admission, loans or verification success. Official fees are separate.</p><div class="g">`+SV.map((s,i)=>`<div class="card"><div style="font-size:28px">${s[2]}</div><b>${s[0]}</b><p class="mu">${s[3]}</p><details><summary>Requirements & process</summary><p>${s[4]}</p><p class="mu">Process: 1) Send request on WhatsApp 2) Receive payment instructions 3) Pay and confirm 4) Work is completed 5) You get next steps.</p></details><p><span class="tag">K${s[1]}${i==7?" per course":""}</span></p><button class="wa" onclick="wa(${i})">Request on WhatsApp</button></div>`).join("")+`</div>`},
"Moses Ntembwa AI"(){return `<h2>🤖 Moses Ntembwa AI</h2><div class="card"><p class="mu">Automated answers only. Not official. For complicated cases, contact Moses.</p><div id="chat"><div class="m b">Hello! Ask me anything or tap a question below.</div></div><div>${QA.map((q,i)=>`<span class="chip" onclick="ask(${i})">${q[0]}</span>`).join("")}</div><div class="row" style="margin-top:8px"><input id="q" placeholder="Type your question" style="flex:1;margin:0"><button onclick="ask()">Send</button></div></div>`},
"Ten Universities"(){return `<h2>🏫 Ten Universities</h2><p class="mu">Verify programs, entry requirements and intakes on each official website or ask Moses.</p><div class="g">`+UNI.map((u,i)=>`<div class="card"><b>${u[0]}</b><div class="mu">📍 ${u[1]}</div><p class="mu">Programs, entry and application requirements: confirm with the official source.</p>${u[2]?`<a class="btn alt" href="${u[2]}" target="_blank" rel="noopener">Official site</a> `:""}<button class="wa" onclick="uw(${i})">Get application help</button></div>`).join("")+`</div>`},
HELSB(){const f=[["Who can apply?","Eligible students admitted to recognised institutions. Check official HELSB criteria."],["What documents are needed?","Commonly NRC, admission letter, results, guardian details and account details."],["Appeals","If you disagree with an outcome, you may appeal with supporting documents."],["Status meanings","Check your status on the official HELSB portal. Ask Moses if unsure."]];return `<h2>💰 HELSB</h2><div class="card"><p>The Higher Education Loans and Scholarships Board supports eligible students with loans and scholarships. Always check official announcements for deadlines.</p><a class="btn" href="https://www.helsb.org.zm" target="_blank" rel="noopener">Official HELSB website</a> <button class="wa" onclick="wa(1)">HELSB Application K55</button> <button class="wa" onclick="wa(2)">Appeal K35</button></div><div class="card"><b>FAQ</b>${f.map(x=>`<details><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join("")}</div>`},
"Daily Motivation"(){return `<h2>🌟 Daily Motivation</h2><div class="card un" style="font-size:20px">${MOT[dayIdx()%MOT.length]}</div><p class="mu">A new message appears each day.</p>`},
"Terms & Conditions"(){return `<h2>📜 Terms & Conditions</h2>`+TERMS.map(t=>`<div class="card">${t}</div>`).join("")},
"Contact Support"(){return `<h2>📞 Contact Support</h2><div class="card"><p>WhatsApp: <b>0766427244</b></p><textarea id="cm" rows="4" placeholder="Write your message or complicated case"></textarea><button class="wa" onclick="location.href='https://wa.me/${WA}?text='+encodeURIComponent(greet()+' '+NAME+', '+($('cm').value||'I need assistance.')+(U?' - '+U.name:''))">Send on WhatsApp</button> <a class="btn alt" href="tel:+${WA}">Call</a></div>`},
"Security & Account"(){if(!U)return `<h2>🔐 Account</h2><div class="card"><b>Create account</b><input id="n" placeholder="Full name"><input id="e" type="email" placeholder="Email"><input id="p" placeholder="WhatsApp number (e.g. 0977123456)"><input id="w" type="password" placeholder="Password (8+ characters)"><input id="w2" type="password" placeholder="Confirm password"><label><input type="checkbox" id="tc" style="width:auto"> I agree to the Terms and Privacy rules</label><br><br><button onclick="reg()">Create account</button><div id="ov"></div></div><div class="card"><b>Login</b><input id="le" placeholder="Email"><input id="lw" type="password" placeholder="Password"><button onclick="login()">Login</button> <button class="alt" onclick="forgot()">Forgot password</button><div id="msg" class="mu"></div></div><div class="card"><button class="alt" onclick="admin()">Administrator panel</button></div>`;
return `<h2>🔐 Security & Account</h2><div class="card"><b>${esc(U.name)}</b><p class="mu">${esc(U.email)} · +${U.phone}<br>Status: ${U.status} · ${U.cust?"Customer":"Registered user"}</p><input id="nn" value="${esc(U.name)}"><button onclick="U.name=$('nn').value;W('user',U);go('Security & Account')">Save name</button></div><div class="card"><b>Change password</b><input id="cp" type="password" placeholder="New password (8+)"><button onclick="if($('cp').value.length<8)return alert('Too short');acc(a=>a.pw=btoa($('cp').value));alert('Password changed');note('Security: password changed')">Update</button></div><div class="card"><button class="dg" onclick="U=null;W('user',null);go('Dashboard')">Logout</button> <button class="alt" onclick="admin()">Administrator panel</button></div>`}};
function accs(){return S("accs",[])}function acc(f){const a=accs();const x=a.find(y=>y.email==U.email);if(x){f(x);W("accs",a)}}
function reg(){const n=$("n").value.trim(),e=$("e").value.trim().toLowerCase(),p=ph($("p").value),w=$("w").value;
if(n.length<3||!/^\S+@\S+\.\S+$/.test(e))return alert("Enter a valid name and email");if(!p)return alert("Invalid Zambian phone number");if(w.length<8||w!=$("w2").value)return alert("Passwords must match and be 8+ characters");if(!$("tc").checked)return alert("Please accept the Terms");
if(accs().some(a=>a.email==e))return alert("Email already registered");if(accs().some(a=>a.phone==p))return alert("Phone already registered");
const c=String(Math.floor(1e5+Math.random()*9e5));pend={n,e,p,w,c,t:Date.now(),k:0};$("ov").innerHTML=`<p class="mu">Demo mode: no email can be sent from this preview. Your code is <b>${c}</b> (expires in 10 minutes).</p><input id="otp" placeholder="6-digit code"><button onclick="ver()">Verify</button>`}
function ver(){if(!pend)return;if(Date.now()-pend.t>6e5){pend=null;return alert("Code expired")}if(++pend.k>5){pend=null;return alert("Too many attempts")}if($("otp").value!=pend.c)return alert("Wrong code");
const a=accs();a.push({name:pend.n,email:pend.e,phone:pend.p,pw:btoa(pend.w),status:"Active",cust:false,last:Date.now()});W("accs",a);pend=null;alert("Account verified. Please login.");go("Security & Account")}
let tries=0;function login(){if(tries>=5){return $("msg").textContent="Too many attempts. Reload to try again later."}const a=accs().find(x=>x.email==$("le").value.trim().toLowerCase()&&x.pw==btoa($("lw").value));
if(!a){tries++;return $("msg").textContent="Wrong email or password."}if(a.status=="Suspended")return $("msg").textContent="Account suspended. Contact support.";U=a;W("user",U);note("Welcome back! New login to your account.");go("Dashboard")}
function forgot(){const e=prompt("Your account email");const a=accs().find(x=>x.email==(e||"").trim().toLowerCase());if(!a)return alert("If the account exists, a reset code is sent.");const c=String(Math.floor(1e5+Math.random()*9e5));if(prompt("Demo code: "+c+"\nEnter it:")!=c)return alert("Wrong code");const p=prompt("New password (8+)");if(!p||p.length<8)return;const all=accs();all.find(x=>x.email==a.email).pw=btoa(p);W("accs",all);alert("Password reset. Login now.")}
function uw(i){const m=`${greet()} ${NAME}, I need University Application help for ${UNI[i][0]}. Fee K55. Please send payment instructions and requirements.`;location.href="https://wa.me/"+WA+"?text="+encodeURIComponent(m)}
function ask(i){const t=i!==undefined?QA[i][0]:$("q").value.trim();if(!t)return;let r;if(i!==undefined)r=QA[i][1];else{const w=t.toLowerCase().split(/\W+/).filter(x=>x.length>3);let best=0;QA.forEach((q,k)=>{const s=w.filter(x=>(q[0]+q[1]).toLowerCase().includes(x)).length;if(s>best){best=s;r=QA[k][1]}});if(!r)r="I do not have a verified answer for that. Please contact Moses on WhatsApp 0766427244."}
$("chat").innerHTML+=`<div class="m u">${esc(t)}</div><div class="m b">${esc(r)}<br><span class="mu">Automated answer.</span></div>`;$("chat").scrollTop=1e9;if($("q"))$("q").value=""}
function admin(){const p=prompt("Admin password (demo: admin2026)");if(p!="admin2026")return alert("Access denied");const a=accs();
$("app").innerHTML=`<h2>🛡️ Admin Dashboard</h2><button class="alt" onclick="go('Security & Account')">Back</button><div class="card">Users: ${a.length} · Customers: ${a.filter(x=>x.cust).length} · Suspended: ${a.filter(x=>x.status=="Suspended").length}<br><span class="mu">Demo panel. Real admin security needs a server (see notes).</span></div><div class="card"><b>Publish announcement</b><input id="at" placeholder="Title"><textarea id="ab" placeholder="Message"></textarea><button onclick="ann.unshift([$('at').value,$('ab').value,new Date().toISOString().slice(0,10)]);W('ann',ann);note('New announcement: '+$('at').value);alert('Published')">Publish</button></div><div class="card"><b>Users</b><input id="us" placeholder="Search users" oninput="ul()"><div id="ul"></div></div>`;ul()}
function ul(){const q=($("us").value||"").toLowerCase(),a=accs();$("ul").innerHTML=a.filter(x=>(x.name+x.email).toLowerCase().includes(q)).map(x=>`<div class="card">${esc(x.name)} · ${esc(x.email)}<br><span class="mu">${x.status} · ${x.cust?"Customer":"Registered"}</span><br><button class="alt" onclick="tg('${x.email}','s')">${x.status=="Active"?"Suspend":"Reactivate"}</button> <button class="alt" onclick="tg('${x.email}','c')">Toggle customer</button></div>`).join("")||"<p class='mu'>No users.</p>"}
function tg(e,k){const a=accs(),x=a.find(y=>y.email==e);if(k=="s")x.status=x.status=="Active"?"Suspended":"Active";else x.cust=!x.cust;W("accs",a);ul()}
nav();go(MENU[(parseInt(location.hash.slice(1))||1)-1]?.[0]||"Dashboard");
</script></body></html>
