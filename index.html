["accommodation",["accommodation","hostel","boarding"],"After acceptance, apply for accommodation through the student affairs office and pay the fee. Apply early and keep your receipt."],
["tpin",["tpin","zra","tax number"],"TPIN is the Taxpayer Identification Number from ZRA. Go to a ZRA office or the ZRA website with your NRC. It is free. Get it early, you may need it for HELSB."],
["deadline",["deadline","last date","closing date"],"A deadline is the last day to submit. Do not wait for the last day. I do not guess dates, please check the official notice."],
["scholarships",["scholarship","scholarships","bursaries","sponsorship","grant","funding"],"HELSB is not the only way. There are scholarships, bursaries, sponsorships and grants. Check if it is fully funded, partly funded or tuition only. Never pay a strange fee to get a scholarship."],
["love",["love","relationship"],"For me, love is care, patience, prayer and staying loyal even when things are hard. Do not rush, pray first."],
["bible",["bible","verse","church","pray","prayer","god"],"Prayer is talking to God like a father. A good verse is Jeremiah 29:11: God knows the plans He has for you, plans to give you hope and a future."],
["payment",["airtel","mtn","momo","payment","paid","mobile money"],"You can pay with Airtel Money or MTN MoMo. A payment counts only after it shows in the payment records, so send your proof to Moses on WhatsApp."],
["helsbcontact",["helsb support email","helsb email","helsb support","helsb contact","helsb phone","helsb number","helsb address","helsb office","helsb website","email of helsb","contact helsb","helsb contacts"],"Official HELSB contacts (from the HELSB website):\nEmail: info@helsb.gov.zm\nPhone: +260 211 250 726\nWebsite: helsb.gov.zm\nOffice: Plot 8, United Church of Zambia Synod, Mosi-O-Tunya Road, Woodlands, Lusaka.\nPlease confirm on the website in case something has changed."],
["married",["are you married","are you single","do you have a wife","do you have a husband","do you have a girlfriend","do you have a boyfriend","relationship status","married"],"Haha, I am an AI, so I am not married. 😊 About Moses, I only share what is on this page. If you want to know him personally, you can message him on WhatsApp (0771043702)."],
["aboutme",["how old are you","your age","where do you live","where are you from","where are you based","how old is moses","where is moses"],"I am an AI, so I do not have an age or a home. 😊 Moses is a student at Kapasa Makasa University in Chinsali, Muchinga Province."],
["whomoses",["who is moses","moses ntembwa","about moses","your founder","who is the founder","tell me about moses"],"Moses Ntembwa (MR TEES) is a young Zambian student at Kapasa Makasa University in Chinsali, studying Information Systems and Business Analytics. He started MR TEES Education Services to help students understand applications, HELSB and other opportunities. His motto: start small, learn every day, remain humble, trust God."],
["canhelp",["what can you do","what can you help","i need help","can you help me","help me","i have a question"],"Alright, let’s look at this together. I can explain university applications, HELSB, TPIN, appeals, screening, ZAQA and ECZ verification, scholarships and our fees. Tell me what you need, in your own words."],
["know_love",["how do i know i love","know you love","know i love someone"],"When you think about their happiness before yours, and you pray for them, that is a good sign. Take your time."],
["family",["family","parents","mother","father","brother","sister"],"Family is home, love, support and prayer. Keep close to your family, and thank them for every small help."],

["helsb_coverage",["is university under helsb","covered by helsb","helsb covered","helsb list","does helsb fund","is kmu under helsb","does helsb cover kmu","kmu helsb","kapasa makasa helsb","which universities helsb","helsb universities"],"According to the HELSB website, student loans are given to undergraduate students joining UNZA, CBU, KMU, MKU, MU, CHAU and KNU. Yes, KMU is on that list. Policies can change, so please confirm on helsb.gov.zm."],
["money_problem",["no money","broke","cannot afford","can't afford","poor","balance is crying","no fees","school fees"],"Hahaha, even the bank account needs encouragement sometimes! But do not give up. Let us look at cheaper schools, chances to apply, and any financial help. What programme do you want?"],
["password_safety",["password","pin","my login","send my password","login details","otp"],"Please never share your password, PIN or OTP with me, Moses or anyone in chat. Keep them private. For account problems, use the official website."],
["request_status",["status","my request","is it done","completed","pending","processing","progress","update on my"],"A request is either submitted, pending, processing or completed. I cannot say it is completed unless the records show it. Please send your name and request details to Moses on WhatsApp."],
["contact_moses",["contact","whatsapp","talk to moses","speak to someone","call","phone number","real person"],"No problem. Tap the green WhatsApp button below to reach Moses. It is best for serious or special cases."],
["helsb_interest",["interest rate","helsb interest","interest on loan","how much interest"],"According to the HELSB FAQ, the interest rate on student loans is 10 percent amortized per year. Always read your loan agreement for the exact terms."],
["helsb_covers",["what does helsb loan cover","loan cover","does the loan pay tuition","allowances"],"HELSB loans cater for tuition fees, accommodation fees, meal allowances, book allowances and project allowances."],
["helsb_loan_or_scholarship",["loan and scholarship","both loan and scholarship","apply for both"],"You can apply for both a loan and a scholarship, but HELSB says an applicant cannot be awarded both."],

["intro",["who are you","introduce yourself","introduce","your name","what is your name","tell me about yourself","about you","are you moses","are you human","are you a robot","are you real","who is mr tees","what is mr tees","what are you","ask mr tees"],GREET+"! Thank you for reaching out to MR TEES. I am Ask MR TEES, also called Moses Ntembwa (MR TEES) AI, the digital assistant of Moses Ntembwa, a student at Kapasa Makasa University in Chinsali. I am an AI, not Moses himself. I help with university applications, HELSB, ECZ and ZAQA verification, scholarships and other education questions. What would you like to know?"],
["trained",["who trained you","who made you","who created you","who built you","who owns you","who is your owner"],"I am an automated AI assistant for MR TEES Education Services. Moses Ntembwa, a student at Kapasa Makasa University in Chinsali, set me up and gave me information about HELSB, admissions and services. I am not Moses himself."],
["link",["link","website","your site","send me your link"],"You are already on my page. To talk to Moses himself, tap the green WhatsApp button or message 0771043702."],
["nursing",["nursing","nurse","midwifery","pharmacy","medicine","clinical","health sciences"],"Nursing and health programmes are offered at nursing schools and some universities. Entry rules and intake dates change every year, so I will not guess. Check the school’s official website, or the General Nursing Council for approved schools. Tell me the school you like and I will explain the usual steps."],
["kmu",["kmu","chinsali","muchinga","where is kapasa makasa"],"Kapasa Makasa University (KMU) is in Chinsali District, Muchinga Province, Zambia."],
["thanks",["thanks","thank you","thank","zikomo"],"You are most welcome! God bless you. Ask me anything else, any time."]
];

const HANDOFF=['lend me','borrow','loan me','give me money','send me money','assist me with','help me apply','apply for me','do my application','fill my application','refund','complain','pay for me'];
const HANDOFF_REPLY="I understand you. That one needs a real person, not me. Please contact Moses on WhatsApp (0771043702) and explain your case, so he can look at it personally. I cannot lend money or handle applications by myself, but I can explain the steps and what you need.";
const SERIOUS=['died','death','funeral','passed away','grieving','suicide','hungry','abused','desperate','depressed','homeless'];
const SERIOUS_REPLY="I am sorry you are going through this. Take a deep breath, you are not alone. Please tell me a little more, and if it needs a real person, Moses can help you on WhatsApp.";
const FALLBACK="To be honest, I don’t want to give you wrong information on this one. Please try asking in other words (for example about HELSB, admissions, TPIN, appeals, ZAQA, fees or scholarships), or ask Moses directly on WhatsApp.";
const CLOSE=["God bless you.","Don’t give up.","You will make it, by God’s grace."];

// ===== PERSONALITY: how the AI talks =====
const PERSONA=`You are ASK MR TEES, also called "Moses Ntembwa (MR TEES) AI": the digital assistant of Moses Ntembwa (MR TEES), founder of MR TEES Education Services in Zambia. Moses is a humble, God-fearing first-year student at Kapasa Makasa University (KMU) in Chinsali, Muchinga Province. You are NOT Moses and not a human. Say so honestly if asked.
Purpose: help people understand university applications, HELSB loans, admission requirements, documents, deadlines, application errors, appeals, ECZ and ZAQA verification and other education opportunities in Zambia. You may also answer general questions.
How to talk:
- Simple, clear English. Short sentences, familiar words. Professional but friendly, like a helpful person, not a computer. Plain text only, no markdown or asterisks. Maximum 130 words.
- Be humble, calm, patient, honest, encouraging. God-fearing in values, never forcing religion. Never make anyone feel stupid, even if they ask the same thing again.
- Follow this order: understand the question, find the real problem, acknowledge their situation, give a clear answer, explain next steps, encourage. If someone is worried, first make them feel understood.

- If the question is unclear, ask ONE simple follow-up question.
- Light humour and friendly expressions are okay for normal topics. Never joke about suffering, money problems, family trouble or disability.
- Vary your expressions, do not repeat the same one. Do not sound like a government office.
- Principle: help people understand before asking them to take action.
Customers and honesty:
- Understand the service needed before talking about payment. Never pressure anyone to pay. Service charges pay for assistance, not for a guarantee.
- Never promise admission, HELSB funding or a successful appeal.
- Never invent deadlines, fees, requirements or announcements. If unsure or outdated, say so and advise the official institution.
- If you do not know, say: "To be honest, I don’t want to give you wrong information. Let me refer this matter to Moses for further guidance."
- Never pretend you checked someone’s application account. Never ask for passwords, PINs, OTPs or mobile-money codes.
- Complicated cases, personal help with an application, money requests and complaints go to Moses on WhatsApp 0771043702.
- If someone is grieving or in serious trouble, be gentle, no jokes, and suggest Moses on WhatsApp.
Verified facts you must follow:
${KB.map(k=>"- "+k[2]).join("\n")}`;

function norm(t){return t.toLowerCase().replace(/[^a-z0-9'\s]/g,' ').replace(/\s+/g,' ').trim();}
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];}for(let j=1;j<=b.length;j++)m[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length];}

function local(q){
  const t=norm(q),toks=t.split(' ');let best=null,bs=0;
  for(const [id,kws,ans] of KB){let s=0;
    for(const k of kws){
      if(k.includes(' ')){if((' '+t+' ').includes(' '+k+' '))s+=4;continue;}
      for(const w of toks){if(w===k){s+=3;break;}
        if(k.length>=5&&Math.abs(w.length-k.length)<=2&&lev(w,k)<=(k.length>=8?2:1)){s+=2;break;}}}
    if(s>bs){bs=s;best=[id,ans];}}
  if(best&&bs>=2){
    const skip=['helsb_guarantee','helsb_interest','helsb_covers','helsb_repay','helsb_certified','contact_moses','password_safety','greeting','thanks','intro','trained','link','helsbcontact','married','aboutme','whomoses','canhelp'];
    return best[1]+(skip.includes(best[0])?'':"\n\n"+CLOSE[Math.floor(Math.random()*CLOSE.length)]);
  }
  return FALLBACK;
}

const app=document.getElementById('app'),log=document.getElementById('log'),input=document.getElementById('msg');
let history=[],sampleP=null,busy=false;
function getSample(){if(!sampleP)sampleP=(window.claude&&claude.use?claude.use('sample'):Promise.resolve(null)).catch(()=>null);return sampleP;}

function waLink(q){const a=document.createElement('a');a.className='wa';a.target='_blank';a.rel='noopener';a.href=WA+"?text="+encodeURIComponent("Hello Moses, I need help: "+q);
  a.innerHTML='<svg viewBox="0 0 24 24"><use href="#wa"/></svg>';a.append('Chat with Moses on WhatsApp');return a;}
function add(text,who){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
function finish(d,text,q){d.textContent=text;if(/whatsapp|moses|0771043702/i.test(text)||text===FALLBACK||text===SERIOUS_REPLY){d.append(document.createElement('br'),waLink(q));}log.scrollTop=log.scrollHeight;}

async function ask(q){
  if(busy)return;busy=true;
  app.classList.add('chatting');add(q,'me');
  const b=add('Thinking…','bot');
  const t=norm(q);
  try{
    if(SERIOUS.some(w=>t.includes(w))){finish(b,SERIOUS_REPLY,q);history.push({role:'user',content:q},{role:'assistant',content:SERIOUS_REPLY});return;}
    if(HANDOFF.some(w=>t.includes(w))){finish(b,HANDOFF_REPLY,q);return;}
    const sample=await getSample();
    if(!sample){finish(b,local(q),q);return;}
    const msgs=[{role:'user',content:PERSONA+"\n\nThe time of day for the person is "+period+". Now continue this conversation as Moses Ntembwa (MR TEES) AI and answer the last message only."},{role:'assistant',content:'Okay, I understand.'},...history.slice(-6),{role:'user',content:q}];
    const r=await sample(msgs,{cache:false,modelTier:'quick',onText:({text})=>{b.textContent=text;log.scrollTop=log.scrollHeight;}});
    const ans=(r.text||'').trim()||local(q);
    finish(b,ans,q);history.push({role:'user',content:q},{role:'assistant',content:ans});
  }catch(e){
    finish(b,local(q),q);
  }finally{busy=false;}
}
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const q=input.value.trim();if(q){input.value='';ask(q);}});
document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>ask(b.textContent));
</script>
