async function doReg(){

async function doLogin(role){
  const e=$('#e').value.trim().toLowerCase(),p=$('#p').value,pin=role==='admin'?$('#pin').value:'';
  const k=role+':'+e,m=x=>{$('#m').innerHTML='<div class="msg">'+esc(x)+'</div>'};

  const u=DB.users.find(x=>x.email===e&&x.role===role);
  const ok=u&&u.ph===await H(p)&&(role!=='admin'||u.pin===await H(pin));
  if(!ok){const left=failTry(k);log('Failed '+role+' login for '+e,'visitor');return m(left>0?'Incorrect login details. '+left+' attempt(s) left before a temporary lock.':'Too many failed attempts. Login locked for 2 minutes.')}
  if(u.status==='suspended')return m('This account is suspended. Please contact the administrator.');
  delete DB.tries[k];S={uid:u.id,exp:Date.now()+IDLE};ss();log('Logged in',u.email);save();

}

  let b='';
  if(tab==='overview'){
    b=`<div class="grid"><div class="card"><span class="sub">STUDENTS</span><div class="num">${stu.length}</div></div><div class="card"><span class="sub">AWAITING CONFIRMATION</span><div class="num">${pend.length}</div></div><div class="card"><span class="sub">ACTIVE ACCOUNTS</span><div class="num">${stu.filter(u=>u.status==='active').length}</div></div><div class="card"><span class="sub">SERVICE REQUESTS</span><div class="num">${DB.reqs.length}</div></div></div>
    <div class="card"><div class="row"><h2>Notifications</h2><button class="btn w" style="border-color:#000" onclick="markRead()">Mark all read</button></div>${DB.notes.length?DB.notes.slice(0,12).map(n=>'<div class="msg" style="'+(n.r?'opacity:.55':'')+'"><b>'+fmt(n.t)+'</b><br>'+esc(n.x)+'</div>').join(''):'<p class="sub">No notifications yet. Register a student and submit a payment to see one.</p>'}</div>`;
  }else if(tab==='payments'){
    b=`<div class="card"><h2>Payments awaiting confirmation</h2><p class="sub">Check each transaction ID in your Airtel Money or MTN MoMo app, then confirm or reject.</p>${pend.length?'<div class="scroll"><table><tr><th>ID</th><th>Student</th><th>Phone</th><th>Network</th><th>Amount</th><th>Transaction ID</th><th>Time</th><th>Decision</th></tr>'+pend.map(p=>`<tr><td>${p.id}</td><td>${esc(p.name)}<br><small>${esc(p.email)}</small></td><td>${esc(p.tel)}</td><td>${esc(p.net)}</td><td>K${p.amt}</td><td><b>${esc(p.txn)}</b></td><td>${fmt(p.t)}</td><td><select class="in sm" id="rr${p.id}"><option>Transaction not found</option><option>Amount does not match</option><option>Wrong receiver number</option></select><button class="btn" onclick="confirmPay('${p.id}')">Confirm</button><button class="btn w" style="border-color:#000" onclick="rejectPay('${p.id}')">Reject</button></td></tr>`).join('')+'</table></div>':'<p class="sub">Nothing is waiting. New submissions appear here.</p>'}</div>
    <div class="card"><h2>Payment history</h2>${DB.pays.filter(p=>p.st!=='pending').length?'<div class="scroll"><table><tr><th>ID</th><th>Student</th><th>Transaction ID</th><th>Status</th><th>Decided by</th></tr>'+DB.pays.filter(p=>p.st!=='pending').map(p=>'<tr><td>'+p.id+'</td><td>'+esc(p.name)+'</td><td>'+esc(p.txn)+'</td><td><span class="badge '+(p.st==='confirmed'?'on':'')+'">'+p.st+'</span>'+(p.reason?'<br><small>'+esc(p.reason)+'</small>':'')+'</td><td>'+esc(p.by||'')+'</td></tr>').join('')+'</table></div>':'<p class="sub">No decisions yet.</p>'}</div>`;
  }else if(tab==='students'){
    b=`<div class="card"><h2>Students</h2>${stu.length?'<div class="scroll"><table><tr><th>Name</th><th>Email</th><th>Phone</th><th>Status</th><th>Joined</th><th>Action</th></tr>'+stu.map(u=>'<tr><td>'+esc(u.name)+'</td><td>'+esc(u.email)+'</td><td>'+esc(u.tel)+'</td><td><span class="badge '+(u.status==='active'?'on':'')+'">'+ST[u.status]+'</span></td><td>'+fmt(u.t)+'</td><td><button class="btn w" style="border-color:#000" onclick="toggleUser(\''+u.id+'\')">'+(u.status==='suspended'?'Reactivate':'Suspend')+'</button></td></tr>').join('')+'</table></div>':'<p class="sub">No students registered yet.</p>'}</div>`;
  }else if(tab==='requests'){
    b=`<div class="card"><h2>Service requests</h2>${DB.reqs.length?'<div class="scroll"><table><tr><th>ID</th><th>Student</th><th>Services</th><th>Total</th><th>Status</th></tr>'+DB.reqs.map(r=>'<tr><td>'+r.id+'</td><td>'+esc(r.name)+'</td><td>'+r.items.map(esc).join(', ')+'</td><td>K'+r.total+'</td><td><select class="in sm" onchange="setReq(\''+r.id+'\',this.value)">'+['Submitted','In progress','Completed'].map(s=>'<option'+(s===r.st?' selected':'')+'>'+s+'</option>').join('')+'</select></td></tr>').join('')+'</table></div>':'<p class="sub">No requests yet.</p>'}</div>`;
  }else if(tab==='posts'){b=postsAdmin()}else if(tab==='documents'){b=docsAdmin()}else if(tab==='audit'){
    b=`<div class="card"><h2>Security log</h2><p class="sub">Logins, failed attempts, blocked access, confirmations and password changes.</p><div class="scroll"><table><tr><th>Time</th><th>User</th><th>Event</th></tr>${DB.audit.map(a=>'<tr><td>'+fmt(a.t)+'</td><td>'+esc(a.w)+'</td><td>'+esc(a.a)+'</td></tr>').join('')}</table></div></div>`;
  }else{
    b=`${linksCard()}<div class="card"><h2>Settings</h2><label class="chk"><input type="checkbox" ${DB.set.otp?'checked':''} onchange="toggleOtp(this.checked)"><span>Require SMS OTP phone verification at registration (needs an SMS provider on a live site)</span></label><button class="btn" style="margin-top:14px" onclick="resetDemo()">Erase all demo data</button></div>`;
  }
  return `<div class="card dark"><h2>Administrator dashboard</h2><p class="sub" style="opacity:.85">Signed in as ${esc(me().email)}. Only administrator accounts can see this area.</p><div class="tabs">${tabs.map(t=>'<button class="'+(tab===t[0]?'on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+(t[0]==='payments'&&pend.length?' ('+pend.length+')':'')+'</button>').join('')}</div></div>${b}`;
}
function confirmPay(id){
  if(!isAdmin())return;const p=DB.pays.find(x=>x.id===id);if(!p||p.st!=='pending')return;
  p.st='confirmed';p.by=me().email;const u=DB.users.find(x=>x.id===p.uid);
  if(u){u.status='active';(u.inbox=u.inbox||[]).unshift('Payment '+p.txn+' was confirmed. Your account is now active.')}
  log('Confirmed payment '+p.txn);save();toast('Payment confirmed. Student account activated.');render();
}
function rejectPay(id){
  if(!isAdmin())return;const p=DB.pays.find(x=>x.id===id);if(!p||p.st!=='pending')return;
  p.st='rejected';p.by=me().email;p.reason=$('#rr'+id).value;const u=DB.users.find(x=>x.id===p.uid);
  if(u){u.status='unpaid';(u.inbox=u.inbox||[]).unshift('Payment '+p.txn+' was rejected: '+p.reason+'. Please submit the correct transaction ID.')}
  log('Rejected payment '+p.txn+' ('+p.reason+')');save();toast('Payment rejected.');render();
}
function toggleUser(id){
  if(!isAdmin())return;const u=DB.users.find(x=>x.id===id);if(!u||u.role!=='student')return;
  if(u.status==='suspended'){u.status=u.prev||'unpaid'}else{u.prev=u.status;u.status='suspended'}
  log('Changed account status for '+u.email+' to '+u.status);save();render();
}
function setReq(id,v){if(!isAdmin())return;const r=DB.reqs.find(x=>x.id===id);if(r){r.st=v;log('Request '+id+' set to '+v);save()}}
function markRead(){if(!isAdmin())return;DB.notes.forEach(n=>n.r=true);save();render()}
function toggleOtp(v){if(!isAdmin())return;DB.set.otp=v;log('SMS OTP '+(v?'enabled':'disabled'));save()}
function resetDemo(){if(!isAdmin())return;try{localStorage.removeItem('mnDemoDB');sessionStorage.removeItem('mnS')}catch(e){}location.hash='#home';location.reload()}
/* ---------- NEWS, UPDATES AND NOTICES ---------- */
let editId=null;const TYPES=['News','Update','Notice'];
const WAI='<svg width="24" height="24" viewBox="0 0 32 32" style="vertical-align:middle;margin-right:8px">'+'<circle cx="16" cy="16" r="16" fill="#25D366"/><path fill="#fff" d="M16 6.2a9.7 9.7 0 0 0-8.4 14.6L6.2 25.8l5.1-1.3A9.7 9.7 0 1 0 16 6.2z"/><path fill="#25D366" d="M12.3 11.2c.3-.3.8-.3 1 .1l.9 1.9c.1.3 0 .6-.2.8l-.5.6c.8 1.6 2.1 2.8 3.7 3.6l.6-.7c.2-.2.5-.3.8-.2l1.8.9c.4.2.5.6.3 1-.5 1.1-1.6 1.7-2.7 1.4-3.2-.9-5.6-3.2-6.5-6.4-.3-1 .1-2 .8-3z"/>'+'</svg>';
const postsList=n=>DB.posts.slice().sort((a,b)=>(b.imp?1:0)-(a.imp?1:0)||b.t-a.t).slice(0,n||99);
function postHTML(p,adm){return '<div class="post '+(p.type==='Notice'?'notice':'')+'"><div class="row"><span class="badge '+(p.type==='Notice'?'red':p.type==='News'?'on':'')+'">'+p.type+'</span>'+(p.imp?'<span class="badge red">Important</span>':'')+'<small>'+fmt(p.t)+'</small></div><h3 style="margin-top:10px">'+esc(p.title)+'</h3><p class="sub" style="margin:0;opacity:.9">'+esc(p.body).replace(/\n/g,'<br>')+'</p>'+(adm?'<div style="margin-top:8px"><button class="btn w" style="border-color:#000" onclick="editPost(\''+p.id+'\')">Edit</button><button class="btn r" onclick="delPost(\''+p.id+'\')">Delete</button></div>':'')+'</div>'}
function postsCard(n){return DB.posts.length?'<div class="card" id="sec-news"><h2>News, Updates and Notices</h2>'+postsList(n).map(p=>postHTML(p)).join('')+'</div>':''}
function impBanner(){const p=postsList().find(x=>x.imp);if(!p)return '';const t=esc(p.title)+': '+esc(p.body);return '<div class="alert"><b>IMPORTANT</b><div class="mq"><div class="track">'+(t+'&nbsp;&nbsp;&nbsp;&bull;&nbsp;&nbsp;&nbsp;').repeat(6)+'</div></div></div>'}
function contactCard(){return '<div class="card dark" id="sec-contact"><div class="row"><div><h2>Contact us on WhatsApp</h2><p class="sub" style="opacity:.85">Questions about services or your account? Message Moses Ntembwa directly on 0771043702.</p></div><a class="btn w" href="https://wa.me/260771043702?text=Hello%20Moses%20Ntembwa%2C%20I%20need%20help." target="_blank" rel="noopener">'+WAI+'Chat on WhatsApp</a></div></div>'}
function postsAdmin(){const e=DB.posts.find(p=>p.id===editId);
  return '<div class="card"><h2>'+(e?'Edit post':'Publish News, Update or Notice')+'</h2><p class="sub">Posts appear on the public home page and on every student dashboard straight away.</p><div id="m"></div>'
  +'<label class="lbl">TYPE</label><select class="in" id="pt">'+TYPES.map(t=>'<option'+(e&&e.type===t?' selected':'')+'>'+t+'</option>').join('')+'</select>'
  +'<label class="lbl">TITLE</label><input class="in" id="ptitle" maxlength="90" value="'+(e?esc(e.title):'')+'">'
  +'<label class="lbl">MESSAGE</label><textarea class="in" id="pbody" rows="4" maxlength="600">'+(e?esc(e.body):'')+'</textarea>'
  +'<label class="chk"><input type="checkbox" id="pimp"'+(e&&e.imp?' checked':'')+'><span>Mark as important (red moving banner at the top of the site)</span></label>'
  +'<button class="btn" style="margin-top:12px" onclick="savePost()">'+(e?'Save changes':'Publish now')+'</button>'+(e?'<button class="btn w" style="border-color:#000" onclick="editId=null;render()">Cancel</button>':'')+'</div>'
  +'<div class="card"><h2>Published posts ('+DB.posts.length+')</h2>'+(DB.posts.length?postsList().map(p=>postHTML(p,true)).join(''):'<p class="sub">Nothing published yet.</p>')+'</div>'}
function savePost(){
  if(!isAdmin())return;const type=$('#pt').value,title=$('#ptitle').value.trim(),body=$('#pbody').value.trim(),imp=$('#pimp').checked;
  if(title.length<3||body.length<5){$('#m').innerHTML='<div class="msg">Enter a title and a message.</div>';return}
  const e=DB.posts.find(p=>p.id===editId);
  if(e){Object.assign(e,{type,title,body,imp});log('Edited '+type+': '+title)}else{DB.posts.push({id:rid(),type,title,body,imp,t:Date.now(),by:me().email});log('Published '+type+': '+title)}
  editId=null;save();toast('Published successfully.');render();
}
function editPost(id){if(!isAdmin())return;editId=id;tab='posts';render();scrollTo({top:0,behavior:'smooth'})}
function delPost(id){if(!isAdmin())return;const p=DB.posts.find(x=>x.id===id);DB.posts=DB.posts.filter(x=>x.id!==id);log('Deleted post: '+(p?p.title:id));save();toast('Post deleted.');render()}
function pwField(id,label,ac,extra){return '<label class="lbl" for="'+id+'">'+label+'</label><div class="pw"><input class="in" id="'+id+'" type="password" autocomplete="'+ac+'" autocapitalize="none" autocorrect="off" spellcheck="false" '+(extra||'')+'><button type="button" class="eye" onclick="eye(\''+id+'\',this)">Show</button></div>'}
function eye(id,b){const i=$('#'+id),h=i.type==='password';i.type=h?'text':'password';b.textContent=h?'Hide':'Show'}
addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches&&e.target.matches('#app input:not([type=checkbox])')){const c=e.target.closest('.card'),b=c&&c.querySelector('.btn,.paybtn');if(b){e.preventDefault();b.click()}}});
/* ---------- MENU ---------- */
function openMenu(){drawMenu();$('#ov').style.display='block';$('#dr').classList.add('open')}
function closeMenu(){$('#ov').style.display='none';$('#dr').classList.remove('open')}
function menuGo(h){closeMenu();go(h)}
function menuTo(id){closeMenu();const sc=()=>{const e=id&&document.getElementById(id);if(e)e.scrollIntoView({behavior:'smooth'});else scrollTo({top:0,behavior:'smooth'})};if(location.hash!=='#home'&&location.hash!==''){go('#home');setTimeout(sc,450)}else sc()}
function drawMenu(){const u=me(),it=(l,fn)=>'<button class="mi" onclick="'+fn+'">'+l+'</button>';
  let h='<div class="dh"><b style="letter-spacing:3px">MENU</b><button onclick="closeMenu()" aria-label="Close menu">&times;</button></div><div class="grp">WEBSITE</div>'
  +it('Home',"menuTo('')")+it('Services and fees',"menuTo('sec-services')")+it('News and notices',"menuTo('sec-news')")+it('How it works',"menuTo('sec-how')")+it('Contact on WhatsApp',"menuTo('sec-contact')")+'<div class="grp">ACCOUNT</div>';
  if(!u)h+=it('Create account',"menuGo('#register')")+it('Student login',"menuGo('#student-login')")+it('Administrator login',"menuGo('#admin-login')");
  else if(u.role==='admin')h+=it('Admin dashboard',"menuGo('#admin')")+it('Log out','closeMenu();logout()');
  else h+=it('My account',"menuGo('#dashboard')")+it('Log out','closeMenu();logout()');
  $('#dr').innerHTML=h}
addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
/* ---------- DOCUMENTS ---------- */
const fsz=b=>b<1024?b+' B':b<1048576?Math.round(b/1024)+' KB':(b/1048576).toFixed(1)+' MB';
function docsCard(u){const my=DB.docs.filter(d=>d.uid===u.id).reverse();
  return '<div class="card"><h2>My documents</h2><p class="sub">Attach the documents needed for your services. In this demo the file name and details are saved. A live website stores the file itself securely on the server.</p><div id="dm"></div>'
  +'<label class="lbl">DOCUMENT TYPE</label><select class="in" id="dt"><option>National ID (NRC)</option><option>Grade 12 results slip</option><option>Passport photo</option><option>Admission letter</option><option>Other</option></select>'
  +'<label class="lbl">CHOOSE FILE</label><input class="in" id="df" type="file"><button class="btn" onclick="addDoc()">Upload document</button>'
  +(my.length?'<div class="scroll" style="margin-top:14px"><table><tr><th>Type</th><th>File</th><th>Size</th><th>Date</th><th>Status</th></tr>'+my.map(d=>'<tr><td>'+esc(d.cat)+'</td><td>'+esc(d.file)+'</td><td>'+fsz(d.size)+'</td><td>'+fmt(d.t)+'</td><td><span class="badge '+(d.st==='Verified'?'on':d.st==='Rejected'?'red':'')+'">'+d.st+'</span></td></tr>').join('')+'</table></div>':'')+'</div>'}
function addDoc(){const u=me();if(!u||u.role!=='student')return;const f=$('#df').files[0];
  if(!f){$('#dm').innerHTML='<div class="msg">Please choose a file first.</div>';return}
  DB.docs.push({id:'D'+(DB.docs.length+1),uid:u.id,name:u.name,cat:$('#dt').value,file:f.name,size:f.size,st:'Pending review',t:Date.now()});
  note('DOCUMENT from '+u.name+': '+$('#dt').value+' ('+f.name+')');log('Uploaded document '+f.name);save();toast('Document added.');render()}
function docsAdmin(){return '<div class="card"><h2>Student documents</h2><p class="sub">Review each document and mark it Verified or Rejected. The student sees the result on their dashboard.</p>'+(DB.docs.length?'<div class="scroll"><table><tr><th>Student</th><th>Type</th><th>File</th><th>Size</th><th>Date</th><th>Status</th></tr>'+DB.docs.map(d=>'<tr><td>'+esc(d.name)+'</td><td>'+esc(d.cat)+'</td><td>'+esc(d.file)+'</td><td>'+fsz(d.size)+'</td><td>'+fmt(d.t)+'</td><td><select class="in sm" onchange="setDoc(\''+d.id+'\',this.value)">'+['Pending review','Verified','Rejected'].map(x=>'<option'+(x===d.st?' selected':'')+'>'+x+'</option>').join('')+'</select></td></tr>').join('')+'</table></div>':'<p class="sub">No documents uploaded yet.</p>')+'</div>'}
function setDoc(id,v){if(!isAdmin())return;const d=DB.docs.find(x=>x.id===id);if(!d)return;d.st=v;const u=DB.users.find(x=>x.id===d.uid);if(u)(u.inbox=u.inbox||[]).unshift('Your document "'+d.file+'" was marked: '+v+'.');log('Document '+d.file+' set to '+v);save();toast('Document updated.')}
/* ---------- PORTAL LINKS ---------- */
function linksCard(){const b=location.href.split('#')[0],ls=[['Student link',b+'#student-login'],['Administrator link',b+'#admin-login']];
  return '<div class="card"><h2>Portal links</h2><p class="sub">Two separate entrances to the same system. Both use the same student records, payments, requests and documents. If a link opens the home page, open it in a browser such as Chrome, or use the Student Portal and Administrator Portal buttons on the home page.</p>'+ls.map(l=>'<label class="lbl">'+l[0].toUpperCase()+'</label><input class="in" readonly value="'+esc(l[1])+'" onclick="this.select()" style="margin-bottom:8px"><button class="btn w" style="border-color:#000;margin-bottom:14px" data-u="'+esc(l[1])+'" onclick="copyLink(this.dataset.u)">Copy '+l[0].toLowerCase()+'</button>').join('')+'</div>'}
function copyLink(u){try{navigator.clipboard.writeText(u).then(()=>toast('Link copied.'),()=>toast('Press and hold the link to copy it.'))}catch(e){toast('Press and hold the link to copy it.')}}
function portals(){return '<div class="grid" style="margin-top:16px"><a class="tile pt" href="#student-login"><b>Student Portal</b><span>Register, pay, request services and read notices.</span><em>Open student login</em></a><a class="tile pt adm" href="#admin-login"><b>Administrator Portal</b><span>Staff only. Confirm payments, post notices and manage students.</span><em>Open admin login</em></a></div>'}
init();
</script>
</body>
</html>
