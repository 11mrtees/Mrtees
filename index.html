<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr Tees (Moses Ntembwa) AI</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a2e5c;--deep:#061c3a;--night:#030f21;--gold:#ff7a00;--gold2:#ffa94d;--ink:#ff9f43;--mute:#ffc58a;--green:#2ee66b;--wa:#25D366;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Nunito Sans','Segoe UI',Arial,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 50% 0%,#0b2a6b 0%,#050d24 45%,#000 100%);background-color:#000;overflow:hidden}
#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
h1,h2{font-family:'Fraunces',Georgia,serif}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
#sky{position:fixed;top:calc(84px + env(safe-area-inset-top,0px));right:18px;width:44px;height:44px;border-radius:50%;z-index:0;pointer-events:none}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(calc(-100vw + 90px),46px)}}
#sky{animation:drift 110s ease-in-out infinite alternate}
#sky.sun{background:radial-gradient(circle at 40% 40%,#fff6b0,#ffc933 55%,#ff9500);box-shadow:0 0 30px 10px rgba(255,170,0,.55),0 0 90px 30px rgba(255,140,0,.25);animation:drift 110s ease-in-out infinite alternate,pulse 5s ease-in-out infinite}
#sky.luna{background:radial-gradient(circle at 62% 30%,rgba(0,0,0,.14) 7px,transparent 8px),radial-gradient(circle at 35% 62%,rgba(0,0,0,.12) 10px,transparent 11px),radial-gradient(circle at 35% 35%,#fff,#e3eaf7 60%,#aab7cf);box-shadow:0 0 28px 6px rgba(220,230,255,.45),0 0 80px 24px rgba(120,160,255,.18)}
@keyframes pulse{50%{box-shadow:0 0 40px 14px rgba(255,170,0,.7),0 0 110px 40px rgba(255,140,0,.3)}}
/* chat */
#chat{display:flex;flex:1;min-height:0;flex-direction:column}
.head{display:flex;align-items:center;gap:12px;padding:12px 14px;background:transparent;border-bottom:1px solid rgba(255,255,255,.12)}
.head b{display:block;font-family:'Fraunces',serif;font-size:15px;letter-spacing:.3px;color:var(--green);line-height:1.15;text-shadow:0 0 12px rgba(46,230,107,.45)}
.head span{font-size:12px;color:var(--mute)}
.head span i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--wa);margin-right:5px}
.head div{flex:1;min-width:0}
.new{background:transparent;border:1px solid var(--gold);color:var(--gold2);border-radius:18px;padding:7px 12px;font-size:12px}
#msgs{flex:1;min-height:0;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:9px}
.day{align-self:center;font-size:12px;color:var(--gold2);border:1px solid rgba(201,162,39,.35);border-radius:16px;padding:4px 14px;background:rgba(10,46,92,.5)}
.msg{display:flex;gap:8px;max-width:88%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.bub{padding:2px 4px;border-radius:0;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
.msg .av{display:none}
.bot .bub{color:var(--ink)}
.me .bub{color:#fff;text-align:right}
.bub a{color:var(--gold2)}
.wa{display:inline-flex;align-items:center;gap:8px;margin-top:8px;background:var(--wa);color:#fff!important;text-decoration:none;font-weight:800;font-size:13px;padding:8px 14px;border-radius:26px;box-shadow:0 4px 14px rgba(37,211,102,.35)}
.wa svg{width:20px;height:20px;fill:#fff}
.bar{display:flex;gap:8px;padding:10px 12px 12px;background:transparent}
.bar input{flex:1;min-width:0;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:22px;color:#fff;padding:11px 15px;font:inherit;font-size:16px}
.bar input::placeholder{color:var(--mute)}
.send{flex:none;width:48px;height:48px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--gold2),var(--gold));color:var(--navy);font-size:20px;font-weight:800}
@media(prefers-reduced-motion:reduce){#sky{animation:none!important}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div id="sky" aria-hidden="true"></div>
<div class="app">
  <section id="chat">
    <div class="head">
      <div><b>Mr Tees (Moses Ntembwa) AI</b><span><i></i>Online • Automated assistant</span></div>
      <button class="new" id="clear">New chat</button>
    </div>
    <div id="msgs" aria-live="polite"></div>
    <div class="bar">
      <input id="inp" type="text" placeholder="Type your question…" autocomplete="off" aria-label="Your message">
      <button class="send" id="send" aria-label="Send">➤</button>
    </div>
  </section>
</div>

<script>
// Moses WhatsApp: 0771043702 (Zambia code 260, no zero, no plus)
var WHATSAPP="260771043702";
var KEY="mrtees_chat_v1";

var KB=`You are "Mr Tees (Moses Ntembwa) AI", the automated assistant of MR TEES Education Services, Zambia, founded by Moses Ntembwa. You are NOT Moses and never pretend to be human.
Answer EVERY question the customer asks, on any topic (education, studies, business, money, life advice, general knowledge, technology), clearly and correctly. For MR TEES, HELSB and Zambian education topics use the knowledge below.
STYLE: very simple English, warm and respectful, short answers (under 120 words unless asked for more), one question at a time. You may say brother/sister/friend. Use numbered steps for how-to. Never make anyone feel bad about poor English or lack of knowledge. Remember the whole conversation.
RULES:
1. Questions for information, advice or encouragement (how to apply, what is HELSB, how to write a CV, exam tips, life advice): answer fully and for free, give official websites. Do NOT mention Moses, prices or WhatsApp.
2. Only when the customer asks MR TEES to DO a service for them (e.g. "help me apply", "write my CV for me"), asks the price of a service, wants Moses or a human, wants to pay, has a complaint or a complicated case: name the service, say in one line what it covers, give the exact fee, say Moses Ntembwa handles it, and END the message with the exact token [[WA]] on its own line (the website turns it into the WhatsApp button). Show the button ONLY for a MR TEES service (never for general questions). If the customer asks for the number, give it: 0771043702 (WhatsApp). Never use [[WA]] in any other case.
3. Never invent prices, deadlines, requirements, links, statuses or results. If unsure, say so and point to the official source. Fees are MR TEES service charges, NOT government, university or HELSB fees. Service fee is paid before work starts. There is NO registration fee (the old K20 fee was removed): never mention it. Payment methods and numbers are confirmed by Moses on WhatsApp. Never say a payment was received. Capacity is about 10 customers per day, so no same-day promises.
4. Never promise admission, HELSB loan, scholarship, appeal success, passport, NRC or any result from another institution. Never ask for passwords, PINs, OTPs or NRC numbers. Refuse fake documents, changed results and bribes. Warn about people who sell HELSB loans.
5. Ask a useful follow-up when natural (finished Grade 12: congratulate, ask plans; rejected: comfort, ask the reason; unsure of course: ask subjects and interests).
6. About Moses: founder of MR TEES; young Zambian student of BSc Information Systems and Business Analytics at Kapasa Makasa University (Chinsali, Muchinga), expected graduation 2029; began helping school leavers in 2025; vision: a trusted, professional education and digital services brand; support is nationwide. Never invent achievements, never give private details. MR TEES is not HELSB, a university or government.
SERVICES AND FEES (kwacha), the complete official list: 1 Accommodation assistant (agent) 250; 2 HELSB application 50; 3 HELSB appeal 30; 4 HELSB returning student 50; 5 scholarship application 100; 6 university admission 50; 7 ECZ results verification 40; 8 ZAQA certificate verification 40; 9 ZRA TPIN certificate 30; 10 CV writing 50; 11 application letter 20; 12 past papers with solutions 30 (one course); 13 accommodation application 30; 14 screening support 30; 15 NRC application/replacement 30; 16 passport application 50; 17 email and account creation 20; 18 interview preparation 40; 19 business registration 80; 20 attachment/internship application 50; 21 assignment and research help 50 (teach, never cheat); 22 online application support 30; 23 document scanning and printing 20; 24 WhatsApp/digital support 20; 25 career and academic advice 30. Accommodation: the agent service (K250) means Moses acts as an agent to find and arrange accommodation; the application service (K30) only helps fill the hostel application. If unclear, ask which one. Government, university or PACRA fees are extra. Any service not on this list: Moses must confirm the price.
HELSB FACTS: Higher Education Loans and Scholarships Board, a Zambian government body (Act No. 31 of 2016) for loans and scholarships. It is not a university; admission comes first. Eligible: Zambian with green NRC, admitted to a supported public university, within age and Grade 12 year limits in the current advert, real financial need. Support levels 100/75/50/25 percent of tuition, decided by HELSB. Covers tuition, registration, accommodation, plus allowances. Documents: application letter, admission letter, Grade 12 results, applicant and guardian NRC, plus supporting letters or affidavit of means if needed (must be true and sworn before a Commissioner for Oaths). PDFs max 5MB each. Apply early at portal.helsb.gov.zm. Appeals follow the official announcement. Loan is repaid after graduation (one year grace). 2026/27 advert deadlines: Mulungushi and Palabana 30 May; Kwame Nkrumah and Chalimbana 30 June; Mukuba 30 July; CBU 30 August; UNZA 30 September; Kapasa Makasa, ZUT and Levy Mwanawasa 30 October. Deadlines change every year: always tell students to check the latest advert. Contacts: info@helsb.gov.zm, support@helsb.gov.zm (portal problems), +260 211 447 110, Mon-Fri 08:00-17:00. Follow the Facebook page "Higher Education Loans and Scholarships Board - Zambia". HELSB statuses (25 submitted, 50 verified, 75 shortlisted, 100 awarded): explain carefully, none is a guarantee.
OFFICIAL LINKS: helsb.gov.zm, portal.helsb.gov.zm, applications.unza.zm (UNZA), cbu.ac.zm, kmu.ac.zm, hea.org.zm and online.hea.org.zm (recognised institutions), exams-council.org.zm (ECZ), zaqa.gov.zm, zra.org.zm.`;


var $=function(i){return document.getElementById(i)};
var hist=[],busy=false,sampleFn,sampleTried=false;
try{hist=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){hist=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(hist.slice(-60)))}catch(e){}}

// time of day
function tod(){var h=new Date().getHours();return h<12?["Good morning","☀️"]:h<17?["Good afternoon","🌤️"]:["Good evening","🌙"]}
var T=tod();(function(){var h=new Date().getHours();$("sky").className=(h>=6&&h<18)?"sun":"luna"})();

var WAI='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>';

function fmt(s){s=s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return s.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(https?:\/\/[^\s<)]*[^\s<).,])/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,"<br>")}
function waLink(){return "https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent("Hello Moses, I was chatting with your AI assistant and I need help with ")}
function bubble(role,text,wa){
  var m=document.createElement("div");m.className="msg "+(role==="user"?"me":"bot");
  m.innerHTML=(role==="user"?"":'<div class="av">MT</div>')+'<div class="bub"></div>';
  $("msgs").appendChild(m);setBub(m,text,wa);return m}
function setBub(m,text,wa){var b=m.querySelector(".bub");b.innerHTML=fmt(text)+(wa?'<br><a class="wa" href="'+waLink()+'" target="_blank" rel="noopener">'+WAI+'Chat with Moses on WhatsApp</a>':"");
  $("msgs").scrollTop=$("msgs").scrollHeight}
function split(t){var wa=/\[\[WA\]\]/.test(t);return{t:t.replace(/\[\[?W?A?\]?\]?\s*$/,"").replace(/\[\[WA\]\]/g,"").trim(),wa:wa}}

function greet(back){
  var d=document.createElement("div");d.className="day";d.textContent=T[1]+" "+T[0]+"!";$("msgs").appendChild(d);
  var g=back?T[0]+" and welcome back! 😊 I remember our chat. What would you like to ask next?":
   T[0]+"! 😊 Welcome to **MR TEES Education Services**. I am the AI assistant of Moses Ntembwa. I can explain university applications, HELSB, ECZ, ZAQA, CVs and more in simple English.\nHow can I help you today?";
  bubble("bot",g)}
function openChat(){$("msgs").innerHTML="";greet(hist.length>0);hist.forEach(function(h){var s=h.role==="assistant"?split(h.content):{t:h.content,wa:false};bubble(h.role,s.t,s.wa)});$("inp").focus()}
$("clear").onclick=function(){hist=[];save();openChat()};
$("send").onclick=function(){ask($("inp").value)};
$("inp").addEventListener("keydown",function(e){if(e.key==="Enter")ask($("inp").value)});

async function getSample(){if(sampleTried)return sampleFn;sampleTried=true;
  try{if(window.claude&&claude.use)sampleFn=await claude.use("sample")}catch(e){sampleFn=null}return sampleFn}

async function ask(text){text=(text||"").trim();if(!text||busy)return;busy=true;$("inp").value="";
  hist.push({role:"user",content:text});bubble("user",text);
  var m=bubble("bot","Thinking…"),reply,wa=false,s=await getSample();
  if(s){try{
      var msgs=hist.slice(-20).map(function(h){return{role:h.role,content:h.content}});
      if(msgs[0].role!=="user")msgs.shift();
      msgs[0]={role:"user",content:KB+"\n\nThe time of day is: "+T[0]+". Conversation follows.\n\n"+msgs[0].content};
      var r=await s(msgs,{cache:false,modelTier:"default",onText:function(o){var p=split(o.text);setBub(m,p.t||"Thinking…",false)}});
      var p=split(r.text);reply=r.text;setBub(m,p.t,p.wa)
    }catch(e){reply=null}}
  if(!reply){hist.pop();setBub(m,"Sorry, I cannot answer right now. Please try again, or message Moses directly on WhatsApp.",true);busy=false;return}
  hist.push({role:"assistant",content:reply});save();busy=false}

openChat();
// stars: bigger, slowly drifting like a night sky
(function(){var c=$("stars"),x=c.getContext("2d"),S=[],still=matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){c.width=innerWidth;c.height=innerHeight;S=[];for(var i=0;i<Math.min(90,c.width*c.height/11000);i++)S.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+.7,p:Math.random()*6.28,v:Math.random()*.1+.03})}
  function draw(t){x.clearRect(0,0,c.width,c.height);S.forEach(function(s){
    if(!still){s.x-=s.v;s.y+=s.v*.3;if(s.x<-3)s.x=c.width+3;if(s.y>c.height+3)s.y=-3}
    x.globalAlpha=.55+.45*Math.sin(s.p+t*.0015);x.fillStyle="#fff";x.shadowColor="#fff";x.shadowBlur=s.r*3;x.beginPath();x.arc(s.x,s.y,s.r,0,6.28);x.fill()});
    if(!still)requestAnimationFrame(draw)}
  addEventListener("resize",function(){size();if(still)draw(0)});size();draw(0)})();
</script>
</body>
        </html>
