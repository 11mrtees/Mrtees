<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moses Ntembwa (MR TEES) AI</title>
<style>
  :root { --g1:#0d4a2e; --g2:#116b3f; --g3:#1b8a52; --leaf:#2fa866; --white:#fff; --ink:#0b2e1c; --wa:#25d366; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body {
    font-family: "Segoe UI", "Trebuchet MS", sans-serif; color:var(--white);
    background: radial-gradient(ellipse at 50% 0%, var(--g3) 0%, var(--g2) 40%, var(--g1) 100%);
    background-attachment: fixed; overflow:hidden;
  }
  .garden { position:fixed; inset:0; pointer-events:none; z-index:0; }
  .garden svg { position:absolute; overflow:visible; }
  .tl { top:-10px; left:-10px; width:230px; } .tr { top:-10px; right:-10px; width:230px; transform:scaleX(-1); }
  .bl { bottom:70px; left:-10px; width:200px; transform:scaleY(-1); } .br { bottom:70px; right:-10px; width:200px; transform:scale(-1,-1); }
  .app { position:relative; z-index:1; height:100%; max-width:680px; margin:0 auto; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top); }

  .hero { flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:24px 28px; }
  .hero .wave { font-size:.95rem; letter-spacing:.02em; opacity:.9; margin-bottom:10px; }
  .hero h1 { font-family: Georgia, "Palatino Linotype", serif; font-size:clamp(2.1rem, 8vw, 3.2rem); line-height:1.1; margin:0 0 14px; font-weight:700; }
  .hero p { font-size:1.15rem; line-height:1.55; max-width:30ch; margin:0 0 18px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
  .chips button { background:#ffffff1f; color:var(--white); border:1px solid #ffffffaa; border-radius:20px; padding:8px 14px; font-size:.92rem; cursor:pointer; }
  .chips button:hover { background:#ffffff38; }

  .chatting .hero { display:none; }
  .top { display:none; padding:12px 18px; }
  .chatting .top { display:block; }
  .top b { font-family:Georgia,serif; font-size:1.1rem; }
  .top small { display:block; opacity:.85; }
  #log { flex:1; overflow-y:auto; padding:8px 14px; display:none; flex-direction:column; gap:10px; }
  .chatting #log { display:flex; }
  .msg { max-width:86%; padding:11px 15px; border-radius:18px; line-height:1.5; white-space:pre-wrap; font-size:1rem; }
  .bot { background:var(--white); color:var(--ink); align-self:flex-start; border-bottom-left-radius:4px; }
  .me  { background:var(--g1); color:var(--white); border:1px solid #ffffff66; align-self:flex-end; border-bottom-right-radius:4px; }
  .wa { display:inline-block; margin-top:8px; background:var(--wa); color:#fff; padding:8px 14px; border-radius:20px; text-decoration:none; font-weight:700; font-size:.9rem; }

  form { display:flex; gap:8px; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); }
  input { flex:1; padding:14px 16px; border-radius:24px; border:none; font-size:1rem; }
  form button { background:var(--white); color:var(--g1); border:none; border-radius:24px; padding:0 22px; font-weight:700; font-size:1rem; cursor:pointer; }
  input:focus-visible, button:focus-visible { outline:3px solid #ffe27a; }
  @media (max-width:480px){ .tl,.tr{width:150px} .bl,.br{width:130px} }
  @media (prefers-reduced-motion:no-preference){ .hero h1{animation:rise .8s ease-out both} @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}} }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="flower" viewBox="-50 -50 100 100">
      <g fill="currentColor" stroke="#0d4a2e22" stroke-width="1">
        <ellipse cx="0" cy="-26" rx="13" ry="24"/>
        <ellipse cx="0" cy="-26" rx="13" ry="24" transform="rotate(60)"/>
        <ellipse cx="0" cy="-26" rx="13" ry="24" transform="rotate(120)"/>
        <ellipse cx="0" cy="-26" rx="13" ry="24" transform="rotate(180)"/>
        <ellipse cx="0" cy="-26" rx="13" ry="24" transform="rotate(240)"/>
        <ellipse cx="0" cy="-26" rx="13" ry="24" transform="rotate(300)"/>
      </g>
      <circle r="11" fill="#ffd54a"/><circle r="5" fill="#f59e0b"/>
    </symbol>
    <symbol id="leaf" viewBox="0 0 60 30"><path d="M2 15 Q30 -8 58 15 Q30 38 2 15Z" fill="currentColor"/><path d="M6 15 H54" stroke="#0d4a2e55" stroke-width="1.5"/></symbol>
  </defs>
</svg>

<div class="garden" aria-hidden="true">
  <svg class="tl" viewBox="0 0 230 230">
    <path d="M0 30 Q90 40 150 110 T220 220" stroke="#2fa866" stroke-width="5" fill="none"/>
    <use href="#leaf" x="40" y="22" width="44" height="22" style="color:#2fa866" transform="rotate(20 62 33)"/>
    <use href="#leaf" x="100" y="80" width="44" height="22" style="color:#3cc47a" transform="rotate(50 122 91)"/>
    <use href="#flower" x="10" y="10" width="76" height="76" style="color:#ffc6dd"/>
    <use href="#flower" x="105" y="60" width="58" height="58" style="color:#ffffff"/>
    <use href="#flower" x="150" y="140" width="44" height="44" style="color:#ffb3c7"/>
    <use href="#flower" x="20" y="100" width="40" height="40" style="color:#ffe9a8"/>
  </svg>
  <svg class="tr" viewBox="0 0 230 230">
    <path d="M0 30 Q90 40 150 110 T220 220" stroke="#2fa866" stroke-width="5" fill="none"/>
    <use href="#leaf" x="40" y="22" width="44" height="22" style="color:#2fa866" transform="rotate(20 62 33)"/>
    <use href="#flower" x="10" y="10" width="68" height="68" style="color:#fff3b0"/>
    <use href="#flower" x="105" y="60" width="52" height="52" style="color:#ffc6dd"/>
    <use href="#flower" x="150" y="140" width="40" height="40" style="color:#ffffff"/>
  </svg>
  <svg class="bl" viewBox="0 0 230 230">
    <path d="M0 30 Q90 40 150 110 T220 220" stroke="#2fa866" stroke-width="5" fill="none"/>
    <use href="#leaf" x="100" y="80" width="44" height="22" style="color:#3cc47a" transform="rotate(50 122 91)"/>
    <use href="#flower" x="10" y="10" width="70" height="70" style="color:#ffffff"/>
    <use href="#flower" x="105" y="60" width="50" height="50" style="color:#ffb3c7"/>
  </svg>
  <svg class="br" viewBox="0 0 230 230">
    <path d="M0 30 Q90 40 150 110 T220 220" stroke="#2fa866" stroke-width="5" fill="none"/>
    <use href="#leaf" x="40" y="22" width="44" height="22" style="color:#2fa866" transform="rotate(20 62 33)"/>
    <use href="#flower" x="10" y="10" width="64" height="64" style="color:#ffc6dd"/>
    <use href="#flower" x="100" y="64" width="46" height="46" style="color:#fff3b0"/>
  </svg>
</div>

<div class="app" id="app">
  <div class="top"><b>Moses Ntembwa (MR TEES) AI</b><small>Automated assistant · MR TEES Education Services</small></div>

  <section class="hero">
    <div class="wave" id="period">Welcome</div>
    <h1 id="welcomeTitle">Good morning</h1>
    <p id="welcomeText">I am Moses Ntembwa (MR TEES) AI. I am here to assist you. Ask anything that you want to know.</p>
    <div class="chips" id="chips">
      <button>How do I apply for HELSB?</button>
      <button>What is TPIN?</button>
      <button>How do I apply to university?</button>
      <button>What is an appeal?</button>
    </div>
  </section>

  <div id="log" aria-live="polite"></div>

  <form id="form">
    <input id="msg" autocomplete="off" placeholder="Type your question here…" aria-label="Your question">
    <button type="submit">Ask</button>
  </form>
</div>

<script>
const WHATSAPP = "260771043702";   // Moses's number, no + or spaces

// Morning, afternoon or evening, from the person's own phone clock
function getPeriod() {
  const h = new Date().getHours();
  if (h < 12) return 'morning';
  if (h < 17) return 'afternoon';
  return 'evening';
}
const period = getPeriod();
const label = { morning:'Good morning', afternoon:'Good afternoon', evening:'Good evening' }[period];
document.getElementById('welcomeTitle').textContent = label;
document.getElementById('period').textContent = { morning:'☀️ Morning', afternoon:'🌤️ Afternoon', evening:'🌙 Evening' }[period];
document.getElementById('welcomeText').textContent = 'I am Moses Ntembwa (MR TEES) AI. I am here to assist you. Ask anything that you want to know.';

const app = document.getElementById('app');
const log = document.getElementById('log');
const input = document.getElementById('msg');
let lastQ = ''; const history = [];

function add(text, who, showWA) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  if (showWA) {
    const a = document.createElement('a');
    a.className = 'wa'; a.target = '_blank'; a.rel = 'noopener';
    a.href = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent('Hello Moses, I need help: ' + lastQ);
    a.textContent = 'Chat with Moses on WhatsApp';
    d.append(document.createElement('br'), a);
  }
  log.appendChild(d); log.scrollTop = log.scrollHeight;
  return d;
}

async function ask(q) {
  lastQ = q;
  app.classList.add('chatting');
  add(q, 'me');
  const t = add('Typing…', 'bot');
  try {
    const r = await fetch('chat.php', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message:q, period, history })
    });
    const data = await r.json();
    t.remove(); add(data.reply, 'bot', data.whatsapp); history.push({role:'user',content:q},{role:'assistant',content:data.reply});
  } catch (e) {
    t.remove(); add('Network problem. Please check your internet and try again.', 'bot');
  }
}

document.getElementById('form').addEventListener('submit', e => {
  e.preventDefault();
  const q = input.value.trim();
  if (q) { input.value = ''; ask(q); }
});
document.querySelectorAll('#chips button').forEach(b => b.onclick = () => ask(b.textContent));
</script>
</body>
</html>
