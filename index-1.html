<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mr Tees (Moses Ntembwa) AI</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky"></canvas>
<div id="app">
  <aside id="side">
    <button id="newChat">+ Start new chat</button>
    <div id="history"></div>
  </aside>
  <main>
    <header>
      <button id="menu" aria-label="Chats">&#9776;</button>
      <h1>Mr Tees (Moses Ntembwa) AI</h1>
    </header>
    <section id="msgs"></section>
    <form id="form">
      <textarea id="input" rows="1" placeholder="Type your question..."></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </main>
</div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
